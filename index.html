<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* CSS: 화면 레이아웃 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; }

        .container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 검색창 섹션 */
        .sidebar { width: 350px; height: 100%; border-right: 1px solid #ccc; display: flex; flex-direction: column; z-index: 10; background: white; }
        .search-box { padding: 20px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .search-box input { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .search-box button { width: 25%; padding: 10px; background: #ffeb00; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        
        /* 검색 결과 리스트 */
        #result-list { flex: 1; overflow-y: auto; list-style: none; }
        .item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .item:hover { background: #f1f1f1; }
        .item h5 { color: #2c3e50; margin-bottom: 5px; }
        .item p { font-size: 13px; color: #7f8c8d; }

        /* 오른쪽 지도 섹션 */
        #map { flex: 1; height: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소를 입력하세요" onkeypress="if(event.keyCode==13) searchPlaces()">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="result-list">
                </ul>
        </div>

        <div id="map"></div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4bd2ac501e95e7bc54cf1dfe0ee7563f&libraries=services"></script>
    
    <script>
        // 전역 변수 설정
        let map;
        let ps; // 장소 검색 객체
        let markers = []; // 지도에 표시된 마커들을 관리하는 배열

        // 초기화 함수
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.66, 126.83), // 기본 좌표
                level: 5 // 확대 레벨
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places(); // 장소 검색 객체 생성

            // 브라우저 GPS 권한 확인 및 현재 위치로 이동
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const locPosition = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(locPosition); // 지도의 중심을 현재 위치로 변경
                });
            }
        }

        // 장소 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return false;
            }

            // 카카오맵 키워드 검색 서비스 호출
            ps.keywordSearch(keyword, placesSearchCB);
        }

        // 장소 검색 결과 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 목록과 마커를 표시하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('result-list');
            const bounds = new kakao.maps.LatLngBounds();
            
            removeMarker(); // 기존 마커 제거
            listEl.innerHTML = ''; // 기존 리스트 초기화

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                const marker = addMarker(placePosition);
                const itemEl = getListItem(i, places[i]);

                // 지도 범위 확장을 위해 좌표 추가
                bounds.extend(placePosition);

                // 리스트 아이템 클릭 시 지도 이동
                itemEl.onclick = function() {
                    map.panTo(placePosition);
                };

                listEl.appendChild(itemEl);
            }

            // 검색된 장소들이 모두 보이도록 지도 범위 조정
            map.setBounds(bounds);
        }

        // 마커 생성 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position
            });
            marker.setMap(map);
            markers.push(marker);
            return marker;
        }

        // 마커 제거 함수
        function removeMarker() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        // 검색 결과 항목을 HTML로 반환하는 함수
        function getListItem(index, places) {
            const el = document.createElement('li');
            let itemStr = `
                <div class="item">
                    <h5>${places.place_name}</h5>
                    <p>${places.road_address_name ? places.road_address_name : places.address_name}</p>
                    <p style="color:blue">${places.phone}</p>
                </div>
            `;
            el.innerHTML = itemStr;
            return el;
        }

        // 지도 실행
        initMap();
    </script>
</body>
</html>
