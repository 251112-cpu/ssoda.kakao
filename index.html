<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몽글몽글 장소 검색</title>
    <style>
        /* CSS: 파스텔 감성 디자인 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #fff9fb; /* 아주 연한 핑크빛 배경 */
        }

        .container { display: flex; width: 100%; height: 100vh; padding: 15px; gap: 15px; }

        /* 왼쪽 검색창 섹션 */
        .sidebar { 
            width: 350px; height: 100%; 
            background: white; 
            border-radius: 25px; /* 둥글둥글한 모서리 */
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.2); 
            display: flex; flex-direction: column; 
            overflow: hidden;
            z-index: 10;
        }

        .search-box { 
            padding: 25px; 
            background: #fff0f5; /* 연보라빛 핑크 */
            border-bottom: 2px solid #ffe4e1; 
        }
        
        .search-box input { 
            width: 70%; padding: 12px; 
            border: 2px solid #ffc0cb; 
            border-radius: 15px; 
            outline: none;
        }

        .search-box button { 
            width: 25%; padding: 12px; 
            background: #ffb6c1; 
            color: white; border: none; 
            cursor: pointer; font-weight: bold; 
            border-radius: 15px;
            transition: 0.3s;
        }

        .search-box button:hover { background: #ff69b4; }
        
        /* 검색 결과 리스트 */
        #result-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px; }
        
        /* 스크롤바 디자인 */
        #result-list::-webkit-scrollbar { width: 6px; }
        #result-list::-webkit-scrollbar-thumb { background: #ffdadf; border-radius: 10px; }

        .item { 
            padding: 15px; margin-bottom: 10px;
            border-radius: 15px;
            background: #fff;
            border: 1px solid #fff0f5;
            transition: all 0.2s;
            cursor: pointer; 
        }

        .item:hover { 
            background: #fffafb; 
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(255, 182, 193, 0.3);
        }

        .item h5 { color: #ff69b4; margin-bottom: 5px; font-size: 16px; }
        .item p { font-size: 13px; color: #888; }

        /* 오른쪽 지도 섹션 */
        #map { 
            flex: 1; height: 100%; 
            border-radius: 25px; 
            border: 3px solid #ffe4e1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="어디로 갈까요? ✨" onkeypress="if(event.keyCode==13) searchPlaces()">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="result-list">
                </ul>
        </div>

        <div id="map"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4bd2ac501e95e7bc54cf1dfe0ee7563f&libraries=services"></script>
    
    <script>
        let map;
        let ps;
        let markers = [];

        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.66, 126.83),
                level: 5
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const locPosition = new kakao.maps.LatLng(lat, lon);
                    map.setCenter(locPosition);
                });
            }
        }

        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;
            if (!keyword.trim()) {
                alert('검색어를 입력해 주세요! 🌸');
                return false;
            }
            ps.keywordSearch(keyword, placesSearchCB);
        }

        function placesSearchCB(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 없어요. 😢');
            }
        }

        function displayPlaces(places) {
            const listEl = document.getElementById('result-list');
            const bounds = new kakao.maps.LatLngBounds();
            
            removeMarker();
            listEl.innerHTML = '';

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                addMarker(placePosition);
                const itemEl = getListItem(i, places[i]);

                bounds.extend(placePosition);
                itemEl.onclick = function() {
                    map.panTo(placePosition);
                };
                listEl.appendChild(itemEl);
            }
            map.setBounds(bounds);
        }

        function addMarker(position) {
            const marker = new kakao.maps.Marker({ position: position });
            marker.setMap(map);
            markers.push(marker);
            return marker;
        }

        function removeMarker() {
            for (let i = 0; i < markers.length; i++) { markers[i].setMap(null); }
            markers = [];
        }
