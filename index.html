<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몽글몽글 장소 검색</title>
    <style>
        /* CSS: 레이아웃 고정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #fff9fb; overflow: hidden; }
        .container { display: flex; width: 100%; height: 100vh; padding: 15px; gap: 15px; }

        .sidebar { 
            width: 350px; height: 100%; background: white; border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.2); 
            display: flex; flex-direction: column; overflow: hidden; z-index: 10;
        }

        .search-box { padding: 20px; background: #fff0f5; }
        .search-box input { width: 70%; padding: 10px; border-radius: 10px; border: 1px solid #ffb6c1; }
        .search-box button { width: 25%; padding: 10px; background: #ffb6c1; color: white; border: none; border-radius: 10px; cursor: pointer; }

        #result-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px; }
        .item { padding: 15px; border-bottom: 1px solid #fff0f5; cursor: pointer; }
        .item h5 { color: #ff69b4; margin-bottom: 5px; }

        /* 지도 영역 - 크기가 0이면 지도가 안 보이므로 명시적으로 설정 */
        #map { flex: 1; height: 100%; border-radius: 20px; border: 2px solid #ffe4e1; background: #eee; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소 검색 ✨">
                <button id="searchBtn">찾기</button>
            </div>
            <ul id="result-list"></ul>
        </div>
        <div id="map"></div> </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4bd2ac501e95e7bc54cf1dfe0ee7563f&libraries=services"></script>
    
    <script>
        let map;
        let ps;

        // 지도를 그리는 함수
        function init() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.66, 126.83),
                level: 5
            };

            // 지도 객체 생성
            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();

            // 검색 버튼 이벤트 연결
            document.getElementById('searchBtn').onclick = searchPlaces;
            
            // 현재 위치 가져오기 시도
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const moveLatLon = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                    map.setCenter(moveLatLon);
                });
            }
        }

        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;
            if (!keyword.trim()) return alert("검색어를 입력하세요!");
            ps.keywordSearch(keyword, (data, status) => {
                if (status === kakao.maps.services.Status.OK) {
                    displayPlaces(data);
                }
            });
        }

        function displayPlaces(places) {
            const listEl = document.getElementById('result-list');
            const bounds = new kakao.maps.LatLngBounds();
            listEl.innerHTML = '';

            places.forEach(place => {
                const pos = new kakao.maps.LatLng(place.y, place.x);
                const marker = new kakao.maps.Marker({ map, position: pos });
                
                const item = document.createElement('li');
                item.className = 'item';
                item.innerHTML = `<h5>${place.place_name}</h5><p>${place.address_name}</p>`;
                item.onclick = () => map.panTo(pos);
                
                listEl.appendChild(item);
                bounds.extend(pos);
            });
            map.setBounds(bounds);
        }

        // 스크립트 로드 완료 후 실행
        window.onload = init;
    </script>
</body>
</html>
